<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Events — Next-Gen Campus Activity Hub</title>
  <meta name="description" content="Discover, organize, and attend campus events, workshops, sports, and cultural fests with live seat tracking and ticket management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: "#0B0914",
            surface: "#141122",
            "surface-hover": "#1C182E",
            border: "#2A233D",
            "border-glow": "#6D28D9",
            violet: { DEFAULT: "#8B5CF6", dark: "#7C3AED", light: "#A78BFA" },
            teal: { DEFAULT: "#2DD4BF", dark: "#0D9488", light: "#5EEAD4" },
            amber: { DEFAULT: "#F59E0B", dark: "#D97706", light: "#FBBF24" },
            rose: { DEFAULT: "#F43F5E", dark: "#E11D48" },
            emerald: { DEFAULT: "#10B981", dark: "#059669" },
            ink: "#EAE7F2",
            muted: "#9691A8",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            body: ["Inter", "sans-serif"],
          },
          boxShadow: {
            'glow-violet': '0 0 25px -5px rgba(139, 92, 246, 0.3)',
            'glow-teal': '0 0 25px -5px rgba(45, 212, 191, 0.3)',
            'glow-amber': '0 0 25px -5px rgba(245, 158, 11, 0.3)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 3s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            glow: {
              '0%': { boxShadow: '0 0 15px rgba(139, 92, 246, 0.2)' },
              '100%': { boxShadow: '0 0 30px rgba(45, 212, 191, 0.4)' },
            }
          }
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0B0914;
      color: #F3F0FA;
      background-image: 
        radial-gradient(at 10% 20%, rgba(139, 92, 246, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(45, 212, 191, 0.06) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(245, 158, 11, 0.03) 0px, transparent 50%);
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0914;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A233D;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8B5CF6;
    }

    .glass-card {
      background: rgba(20, 17, 34, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card:hover {
      border-color: rgba(139, 92, 246, 0.4);
    }

    .glass-nav {
      background: rgba(11, 9, 20, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Ticket notch effect */
    .ticket-notch-left {
      position: absolute;
      left: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background-color: #0B0914;
      border-radius: 50%;
    }
    .ticket-notch-right {
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      background-color: #0B0914;
      border-radius: 50%;
    }
  </style>
</head>
<body class="bg-base text-ink antialiased selection:bg-violet selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
